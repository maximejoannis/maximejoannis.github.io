      <div class="review-header-actions"><a class="review-source" href="https://github.com/maximejoannis/saucedemo-playwright-agents/blob/main/SPRINT-REVIEW.md" target="_blank" rel="noopener"><i class="fa-brands fa-github"></i>Source Markdown</a><a class="review-source secondary" href="https://github.com/maximejoannis/saucedemo-playwright-agents" target="_blank" rel="noopener"><i class="fa-solid fa-code-branch"></i>Dépôt GitHub</a></div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script src="js/review.js"></script>
<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
const c=document.getElementById('reviewDocument');
mermaid.initialize({startOnLoad:false,theme:'base',securityLevel:'loose',themeVariables:{primaryColor:'#eff6ff',primaryTextColor:'#1f2937',primaryBorderColor:'#2563eb',lineColor:'#2563eb',secondaryColor:'#dbeafe',tertiaryColor:'#f8fbff',fontFamily:'Poppins, sans-serif'}});
try{const r=await fetch('https://raw.githubusercontent.com/maximejoannis/saucedemo-playwright-agents/main/SPRINT-REVIEW.md',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const md=await r.text();c.innerHTML=marked.parse(md,{gfm:true});c.querySelectorAll('pre code.language-mermaid').forEach(code=>{const d=document.createElement('div');d.className='mermaid';d.textContent=code.textContent;code.parentElement.replaceWith(d)});c.querySelectorAll('a[href]').forEach(a=>{const href=a.getAttribute('href');if(href&&!href.startsWith('#')&&!/^https?:\/\//i.test(href)&&!href.startsWith('mailto:')){a.href='https://github.com/maximejoannis/saucedemo-playwright-agents/blob/main/'+href.replace(/^\.\//,'');a.target='_blank';a.rel='noopener'}});await mermaid.run({querySelector:'.mermaid'});window.reviewNavigationInit?.();}catch(e){c.innerHTML='<div class="review-error"><strong>Impossible de charger le document.</strong><p>Vérifiez votre connexion Internet, puis utilisez le bouton Source Markdown.</p></div>';console.error(e)}
</script>
