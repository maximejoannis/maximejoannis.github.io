name: Actualiser les données QualityOps
on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
permissions:
  contents: write
jobs:
  update-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Générer le snapshot public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-github-snapshot.mjs
      - name: Publier les nouvelles données
        run: |
          if git diff --quiet data/github-snapshot.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github-snapshot.json
          git commit -m "Actualiser les données QA"
          git push
